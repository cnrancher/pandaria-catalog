{{- if include "kopilot.deploy.rancherMCPServer" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rancher-mcp-server
  name: rancher-mcp-server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rancher-mcp-server
  template:
    metadata:
      labels:
        app: rancher-mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp-dir
          emptyDir: {}
      {{- with .Values.rancherMCPServer.podScheduling.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rancherMCPServer.podScheduling.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - image: "{{ template "kopilot.registry.default" . }}{{ .Values.rancherMCPServer.image.repository }}:{{ .Values.rancherMCPServer.image.tag }}"
        imagePullPolicy: "{{ .Values.rancherMCPServer.image.pullPolicy }}"
        name: mcp-server
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
          - containerPort: 9092
        command: ["/usr/local/bin/mcp"]
        args:
          - "serve"
          - "--port"
          - "9092"
          - "--insecure"
          {{- if .Values.rancherMCPServer.logLevel }}
          - "--log-level"
          - "{{ .Values.rancherMCPServer.logLevel }}"
          {{- end }}
        resources:
          limits:
          {{- if .Values.rancherMCPServer.limits.memory }}
            memory: {{ .Values.rancherMCPServer.limits.memory }}
          {{- end }}
          {{- if .Values.rancherMCPServer.limits.cpu }}
            cpu: {{ .Values.rancherMCPServer.limits.cpu }}
          {{- end }}
        volumeMounts:
          - name: tmp-dir
            mountPath: /tmp
---
apiVersion: v1
kind: Service
metadata:
  name: rancher-mcp-server
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: rancher-mcp-server
  ports:
    - port: 80
      name: http
      targetPort: 9092
      protocol: TCP
    - port: 443
      name: https
      targetPort: 9092
      protocol: TCP
  type: ClusterIP
{{- end }}
