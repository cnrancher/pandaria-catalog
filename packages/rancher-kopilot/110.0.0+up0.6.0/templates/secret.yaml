{{/* Use the bootstrap password from values.yaml if an existing secret is not found */}}
{{- $bootstrapPassword := .Values.bootstrapPassword -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "bootstrap-secret" -}}
{{- if $existingSecret -}}
    {{- if $existingSecret.data -}}
        {{- if $existingSecret.data.bootstrapPassword -}}
            {{- $bootstrapPassword = $existingSecret.data.bootstrapPassword | b64dec -}}
        {{- end -}}
    {{- end -}}
{{- end -}}
{{/* If a bootstrap password was found in the values or an existing password was found create the secret */}}
{{- if $bootstrapPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: "bootstrap-secret"
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/resource-policy": keep
type: Opaque
data:
  bootstrapPassword: {{ $bootstrapPassword | b64enc | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kopilot-agent-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  LANGFUSE_PUBLIC_KEY: {{ .Values.langfuse.publicKey | b64enc | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.langfuse.secretKey | b64enc | quote }}
  POSTGRE_URL: {{ template "kopilot.postgres.langgraph.url" . }}
---
{{/* Apply kopilot-llm-config from values when missing or llm.forceUpdate=true; otherwise keep existing data (e.g. UI edits). */}}
{{- $llmConfigSecret := lookup "v1" "Secret" .Release.Namespace "kopilot-llm-config" -}}
apiVersion: v1
kind: Secret
metadata:
  name: kopilot-llm-config
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
{{- if or (not $llmConfigSecret) .Values.llm.forceUpdate }}
  LLM_PROVIDER: {{ .Values.llm.provider | b64enc | quote }}
  LLM_BASE_URL: {{ .Values.llm.baseURL | b64enc | default "" | quote }}
  LLM_API_KEY: {{ .Values.llm.apiKey | b64enc | quote }}
  LLM_MODEL: {{ .Values.llm.model | b64enc | quote }}
  LLM_TEMPERATURE: {{ .Values.llm.temperature | printf "%v" | b64enc | quote }}
  LLM_ENABLE_THINKING: {{ .Values.llm.enableThinking | printf "%v" | b64enc | quote }}
  ACTIVE_LLM: {{ .Values.llm.active | b64enc | quote }}
  SECURITY_MODE: {{ .Values.agent.gateway.securityMode | b64enc | quote }}
{{- else }}
  {{- toYaml $llmConfigSecret.data | nindent 2 }}
{{- end }}
---
{{ if .Values.tavily.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: kopilot-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  TAVILY_ENABLED: {{ .Values.tavily.enabled | printf "%v" | b64enc | quote }}
  TAVILY_API_KEY: {{ template "kopilot.tavily.api.key" . }}
{{ end }}
