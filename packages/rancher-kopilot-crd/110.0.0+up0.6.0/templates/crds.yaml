          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: SubAgentConfig is the Schema for the subagentconfigs API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              properties:
                authenticationSecret:
                  description: AuthenticationSecret specifies the authentication secret
                  type: string
                authenticationType:
                  description: AuthenticationType specifies the authentication method
                  enum:
                    - RANCHER
                    - NONE
                    - BASIC
                    - HEADER
                    - OAUTH2
                    - KOPILOT
                  type: string
                builtIn:
                  description: BuiltIn indicates if this is a built-in agent configuration
                  type: boolean
                caBundleRef:
                  description: |-
                    CABundleRef references a secret key containing a PEM-encoded CA
                    certificate bundle to trust when connecting to this agent's MCP server.
                    The CA is scoped to this agent's connection only.
                  properties:
                    key:
                      default: ca.crt
                      description: |-
                        Key is the key inside the secret that holds the data.
                        Defaults to "ca.crt".
                      type: string
                    name:
                      description: Name is the name of the secret in the agent namespace.
                      type: string
                  required:
                    - name
                  type: object
                description:
                  description: Description provides details about the agent's purpose
                  type: string
                displayName:
                  description: DisplayName is the name of the AI agent
                  type: string
                enabled:
                  description: Enabled indicates if this agent configuration is enabled
                  type: boolean
                humanValidationTools:
                  description: HumanValidationTools lists tools requiring human validation
                  items:
                    type: string
                  type: array
                mcpURL:
                  description: MCPURL is the Model Context Protocol server URL
                  type: string
                systemPrompt:
                  description: SystemPrompt is the initial system-level instructions for the agent
                  type: string
                toolSet:
                  description: ToolSet specifies a predefined set of tools for the agent
                  type: string
              required:
                - displayName
              type: object
            status:
              description: SubAgentConfigStatus defines the observed state of SubAgentConfig
              properties:
                conditions:
                  description: Conditions represent the latest available observations of the SubAgentConfig's state
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                phase:
                  description: Phase represents the current phase of the agent configuration
                  type: string
              type: object
          type: object
      selectableFields:
        - jsonPath: .spec.authenticationSecret
        - jsonPath: .spec.authenticationType
        - jsonPath: .spec.enabled
      served: true
      storage: true
