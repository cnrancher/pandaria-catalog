{{- if include "kopilot.deploy.rancherUI" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rancher-mcp-server
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-rancher-mcp-settings
rules:
  - apiGroups:
      - management.cattle.io
    resourceNames:
      - internal-server-url
      - internal-cacerts
    resources:
      - settings
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-rancher-mcp-settings
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-rancher-mcp-settings
subjects:
  - kind: ServiceAccount
    name: rancher-mcp-server
    namespace: {{ .Release.Namespace }}
{{- end }}
