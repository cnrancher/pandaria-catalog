{{- if eq .Values.global.installationType "submariner" }}
{{- if .Values.deleteCRDsOnUninstall }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: submariner-cleanup-crds
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/managed-by: Helm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: submariner-cleanup-crds
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - delete
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: submariner-cleanup-crds
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/managed-by: Helm
subjects:
  - kind: ServiceAccount
    name: submariner-cleanup-crds
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: submariner-cleanup-crds
---
apiVersion: batch/v1
kind: Job
metadata:
  name: submariner-post-delete-cleanup-crds
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: submariner-cleanup-crds
      restartPolicy: Never
      containers:
      - name: cleanup-crds
        image: "{{ template "system_default_registry" . }}{{ .Values.kubectl.repository }}:{{ .Values.kubectl.tag }}"
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          echo "===================================================================="
          echo "Submariner Post-Delete CRD Cleanup Hook"
          echo "===================================================================="
          
          # List of all Submariner-related CRDs to delete
          # Order: CRs' CRDs first, then operator CRDs
          CRDS=(
            # ServiceDiscovery and Submariner CRDs (should be cleaned by pre-delete hook)
            "servicediscoveries.submariner.io"
            "submariners.submariner.io"
            
            # Broker CRD
            "brokers.submariner.io"
            
            # Gateway/Network CRDs (created by submariner-operator at runtime)
            "clusters.submariner.io"
            "endpoints.submariner.io"
            "gateways.submariner.io"
            "clusterglobalegressips.submariner.io"
            "globalegressips.submariner.io"
            "globalingressips.submariner.io"
            "gatewayroutes.submariner.io"
            "nongatewayroutes.submariner.io"
            "routeagents.submariner.io"
            
            # Multi-cluster Service API CRDs (created by lighthouse at runtime)
            "serviceexports.multicluster.x-k8s.io"
            "serviceimports.multicluster.x-k8s.io"
          )
          
          echo "Will attempt to delete the following CRDs:"
          for crd in "${CRDS[@]}"; do
            echo "  - $crd"
          done
          echo ""
          
          SUCCESS_COUNT=0
          SKIP_COUNT=0
          FAIL_COUNT=0
          
          for crd in "${CRDS[@]}"; do
            echo "--- Processing CRD: $crd ---"
            
            # Check if CRD exists
            if ! kubectl get crd "$crd" &>/dev/null; then
              echo "CRD '$crd' not found, skipping."
              SKIP_COUNT=$((SKIP_COUNT + 1))
              continue
            fi
            
            echo "CRD '$crd' exists, deleting..."
            
            # Attempt graceful deletion
            if kubectl delete crd "$crd" --timeout=60s --ignore-not-found=true 2>&1; then
              echo "CRD '$crd' deleted successfully."
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              continue
            fi
            
            # If graceful deletion failed, try force deletion
            echo "Warning: Graceful deletion of CRD '$crd' failed. Attempting force cleanup..."
            
            # Remove finalizers from the CRD itself
            if kubectl patch crd "$crd" \
              -p '{"metadata":{"finalizers":[]}}' \
              --type=merge \
              --ignore-not-found=true 2>&1; then
              echo "  Removed finalizers from CRD '$crd'"
            else
              echo "  Warning: Failed to remove finalizers (CRD may already be deleted)"
            fi
            
            # Force delete
            if kubectl delete crd "$crd" \
              --force \
              --grace-period=0 \
              --ignore-not-found=true 2>&1; then
              echo "CRD '$crd' force deleted."
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo " Failed to delete CRD '$crd'"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
            
            echo ""
          done
          
          echo "===================================================================="
          echo "CRD Cleanup Summary:"
          echo "  Successfully deleted: $SUCCESS_COUNT"
          echo "  Skipped (not found):  $SKIP_COUNT"
          echo "  Failed:               $FAIL_COUNT"
          echo "===================================================================="
          
          if [ $FAIL_COUNT -gt 0 ]; then
            echo "WARNING: Some CRDs failed to delete. Manual cleanup may be required."
            echo "You can verify remaining Submariner CRDs with:"
            echo "  kubectl get crds | grep -E '(submariner\\.io|multicluster\\.x-k8s\\.io)'"
          else
            echo "All Submariner CRDs cleaned up successfully!"
          fi
          
          echo "Post-delete cleanup hook completed."
          
          # Always exit 0 to not block Helm uninstall
          exit 0
{{- end }}
{{- end }}
